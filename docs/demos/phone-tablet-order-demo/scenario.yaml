    type: "任务"
    project: "手机平板订单履约演示"
    priorityDisplay: "P0"
    priorityStorage: "P1"
    initialStatus: "待处理"
    receiver: "fulfillment-ai"
    due: "录制日"
    autoSubmitReview: true
    description: |
      华东手机/平板订单异常处置已进入仓配执行阶段。李工已确认 37 单可从
      华东备用成品仓调拨至华东履约仓，预计订单金额 ¥194,125，需在当天 17:00 前
      完成库存锁定、库存归属变更和订单改派。
      请编制一份成品仓订单再平衡工单草稿，写清订单范围、源仓和目标仓、交接时点，
      以及手机/平板 SKU、IMEI/SN 绑定、保价运输、身份核验签收、发票和售后同步要求。
      工单完成后提交周宁确认，再由平台执行 WMS 建单。
      参考资料：project-inputs/phone-tablet-order/PT-ORD-001-B-履约证据包.md
    acceptance:
      - "输出 37 单可再平衡订单范围"
      - "工单包含 SKU、IMEI/SN、库存归属、跨仓交接和签收约束"
      - "提交人工确认前状态为草稿"

