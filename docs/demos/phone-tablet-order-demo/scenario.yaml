tasks:
  parent:
    title: "[PT-ORD-001] 华东手机/平板订单异常处置"
    type: "任务"
    project: "手机平板订单履约演示"
    priorityDisplay: "P0"
    priorityStorage: "P1"
    initialStatus: "待处理"
    receiver: "zhouning"
    due: "录制日"
    description: |
      周宁，今天华东手机/平板订单异常率到了 7.6%，这块你来牵头处理。
      先让 Data Agent 把异常规模和主要构成看清楚，再找李工核实成品仓和履约条件。
      适合支付恢复、成品仓再平衡或订单改派的尽快推进；需要退款、取消或改约的，
      也要逐单给出明确结论。处理完把复盘报告放到这个任务里，我来 Review。
    acceptance:
      - "126 单全部形成明确处置结论"
      - "完成受影响 SKU、IMEI/SN、成品仓库存与出库能力核实"
      - "人工确认后创建成品仓订单再平衡工单"
      - "上传并核对订单问题排查和处理报告 HTML"
  humanChild:
    title: "[PT-ORD-001-A] 核实成品仓 SKU/序列号与跨仓履约"
    type: "任务"
    project: "手机平板订单履约演示"
    priorityDisplay: "P0"
    priorityStorage: "P1"
    initialStatus: "待处理"
    receiver: "ligong"
    due: "录制日"
    description: |
      核实华东受影响手机/平板订单对应 SKU 的可分配库存、IMEI/SN 状态、出库能力、
      跨仓库存归属变更、高货值运输交接和签收要求。
      请给出可转入再平衡的订单范围、不可履约原因和仓配约束。
    acceptance:
      - "确认可立即出库、需跨仓调拨和不可履约的订单数量"
      - "确认序列号扫描及库存归属变更要求"
      - "确认高货值运输交接、保价和签收约束"
