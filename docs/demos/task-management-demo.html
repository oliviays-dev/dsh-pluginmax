<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>任务管理 · 交互 Demo</title>
  <style>
    :root {
      --bg: #101215;
      --surface: #17191d;
      --surface-2: #1e2126;
      --surface-3: #262a30;
      --line: #2e333a;
      --line-strong: #3c434b;
      --text: #eef1f4;
      --muted: #9ba5b1;
      --faint: #6d7784;
      --accent: #4f8ef7;
      --accent-soft: rgba(79, 142, 247, .14);
      --green: #34d47e;
      --green-soft: rgba(52, 212, 126, .13);
      --amber: #e8a33d;
      --amber-soft: rgba(232, 163, 61, .14);
      --red: #f26d6d;
      --red-soft: rgba(242, 109, 109, .13);
      --purple: #a48bff;
      --purple-soft: rgba(164, 139, 255, .14);
      --radius: 8px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text); background: var(--bg);
      font-family: var(--font); font-size: 14px; line-height: 1.5;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .app { height: 100vh; }
    .shell {
      height: 100%; min-height: 0; display: grid; overflow: hidden;
      grid-template-columns: var(--left-width, 264px) minmax(0, 1fr) var(--right-width, 0px);
      transition: grid-template-columns .24s ease;
    }
    .shell > * { min-height: 0; }
    .shell.left-closed { --left-width: 72px; }
    .shell.meeting-open { --right-width: 322px; }
    .rail {
      min-width: 0; display: flex; flex-direction: column; overflow: hidden; padding: 14px 12px 12px;
      background: #14161a; border-right: 1px solid var(--line);
    }
    .rail.left {
      width: var(--left-width, 264px);
      transition: width .24s ease, padding .24s ease;
    }
    .rail.right { width: 322px; display: flex; flex-direction: column; border-right: 0; border-left: 1px solid var(--line); }
    .rail-head { flex: none; position: relative; z-index: 4; display: flex; align-items: center; gap: 8px; }
    .mode-switch {
      flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px;
      border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
    }
    .mode-tab {
      min-height: 30px; border: 0; border-radius: 5px; background: transparent;
      color: var(--muted); font-size: 12.5px; font-weight: 650;
    }
    .mode-tab.active { color: #fff; background: var(--accent); }
    .mode-tab:not(.active):hover { color: var(--text); background: var(--surface-2); }
    .rail-body { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; }
    .shell.left-closed .rail.left { padding: 12px 15px; }
    .shell.left-closed .rail-head { justify-content: center; }
    .shell.left-closed .mode-switch,
    .shell.left-closed .rail-body,
    .shell.left-closed .nav-label { display: none; }
    .shell.left-closed .primary-nav {
      flex: 1; align-content: start; justify-items: center; margin-top: 16px;
    }
    .shell.left-closed .nav-item {
      width: 42px; height: 42px; justify-content: center; gap: 0; padding: 0;
    }
    .shell.left-closed .nav-item.active { box-shadow: none; }
    .shell.left-closed .nav-item svg { width: 18px; height: 18px; }
    .shell.left-closed .rail-footer { margin-top: auto; padding-top: 0; border-top: 0; }
    .shell.left-closed .rail-footer {
      display: grid; justify-items: center; gap: 6px;
    }
    .shell.left-closed .account-button {
      width: 42px; height: 42px; grid-template-columns: 1fr; gap: 0; padding: 0;
      border: 1px solid var(--line); justify-items: center; background: var(--surface);
    }
    .shell.left-closed .account-button > span:nth-child(2),
    .shell.left-closed .account-button small { display: none; }
    .right-body { flex: 1; min-height: 0; overflow: auto; padding-bottom: 16px; }
    .workspace-switch {
      width: 100%; min-height: 42px; display: grid; grid-template-columns: 28px minmax(0,1fr) 14px;
      align-items: center; gap: 8px; padding: 6px 8px; text-align: left;
      border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text);
    }
    .workspace-switch:hover { border-color: var(--line-strong); background: var(--surface-2); }
    .workspace-mark {
      width: 28px; height: 28px; flex: none; display: grid; place-items: center;
      border-radius: 7px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 800;
    }
    .workspace-name { min-width: 0; }
    .workspace-name strong {
      display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .workspace-name small {
      display: block; margin-top: 1px; color: var(--faint); font-size: 10px; white-space: nowrap;
    }
    .chevron { width: 14px; height: 14px; color: var(--faint); transition: transform .18s; }
    .workspace-switch[aria-expanded="true"] .chevron { transform: rotate(180deg); }
    .workspace-menu {
      position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 30;
      padding: 6px; border: 1px solid var(--line-strong); border-radius: 9px;
      background: #1a1d22; box-shadow: 0 16px 38px rgba(0,0,0,.32); display: none;
    }
    .workspace-menu.open { display: block; }
    .menu-label { padding: 5px 7px 7px; color: var(--faint); font-size: 10.5px; }
    .workspace-option, .account-button {
      width: 100%; min-height: 34px; display: flex; align-items: center; gap: 8px;
      border: 0; border-radius: 6px; background: transparent; color: var(--muted); text-align: left; padding: 6px 8px;
    }
    .workspace-option span:last-child { margin-left: auto; color: var(--faint); font-size: 10.5px; }
    .workspace-option:hover, .account-button:hover { color: var(--text); background: var(--surface-2); }
    .workspace-option.active { color: var(--text); background: var(--surface-3); }
    .workspace-add { display: flex; gap: 6px; margin: 6px 2px 2px; padding-top: 9px; border-top: 1px solid var(--line); }
    .workspace-add input { min-height: 30px; font-size: 12px; }
    .workspace-add button { flex: none; min-height: 30px; padding: 4px 9px; }
    .primary-nav { display: grid; gap: 2px; margin-top: 14px; }
    .nav-item {
      width: 100%; min-height: 36px; display: flex; align-items: center; gap: 9px;
      padding: 7px 9px; border: 0; border-radius: 7px; background: transparent;
      color: var(--muted); font-size: 12.5px; text-align: left;
    }
    .nav-item svg { width: 15px; height: 15px; flex: none; }
    .nav-item:hover { color: var(--text); background: var(--surface-2); }
    .nav-item.active { color: var(--text); background: var(--surface-3); box-shadow: inset 2px 0 0 var(--accent); }
    .nav-section { padding-top: 16px; border-top: 1px solid var(--line); }
    .section-tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .workspace-groups { display: grid; gap: 14px; }
    .workspace-group { min-width: 0; }
    .workspace-head { display: flex; align-items: center; gap: 4px; margin-bottom: 3px; }
    .workspace-title {
      flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; min-height: 31px;
      padding: 6px 7px; border: 0; border-radius: 6px; background: transparent;
      color: var(--muted); font-size: 12.5px; font-weight: 650; text-align: left;
    }
    .workspace-title svg { width: 14px; height: 14px; flex: none; }
    .workspace-title span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .workspace-title:hover { color: var(--text); background: var(--surface-2); }
    .workspace-title.active { color: var(--text); background: var(--surface-3); }
    .icon-action {
      width: 25px; height: 25px; flex: none; display: grid; place-items: center;
      border: 0; border-radius: 6px; background: transparent; color: var(--faint); font-size: 15px;
    }
    .icon-action:hover { color: var(--text); background: var(--surface-2); }
    .workspace-scope {
      width: 100%; min-height: 31px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin-bottom: 12px; padding: 6px 8px; border: 0; border-radius: 6px;
      background: transparent; color: var(--muted); font-size: 12px; text-align: left;
    }
    .workspace-scope:hover { color: var(--text); background: var(--surface-2); }
    .workspace-scope.active { color: var(--text); background: var(--surface-3); }
    .workspace-scope span { color: var(--faint); font-size: 10.5px; }
    .workspace-add[hidden] { display: none; }
    .link-action { border: 0; background: transparent; color: var(--accent); font-size: 10.5px; min-height: 22px; padding: 0 2px; }
    .link-action:hover { text-decoration: underline; }
    .rail-title {
      display: flex; align-items: center; justify-content: space-between; margin: 0 4px 10px;
      color: var(--muted); font-size: 12px; font-weight: 700;
    }
    .rail-title span { color: var(--faint); font-size: 10.5px; font-weight: 500; }
    .rail-section + .rail-section { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
    .rail-footer {
      flex: none; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line);
    }
    .rail-footer {
      display: flex; align-items: center; gap: 6px;
    }
    .settings-button {
      width: 42px; height: 42px; flex: none; display: grid; place-items: center;
      border: 1px solid var(--line); border-radius: 7px;
      background: var(--surface); color: var(--muted); padding: 0;
    }
    .settings-button svg { width: 16px; height: 16px; }
    .settings-button:hover {
      color: var(--text); border-color: var(--line-strong); background: var(--surface-2);
    }
    .settings-button.active {
      color: var(--text); border-color: var(--line-strong); background: var(--surface-3);
    }
    .account-button {
      width: 100%; min-height: 42px; display: grid; grid-template-columns: 28px minmax(0,1fr) auto;
      flex: 1; min-width: 0;
      align-items: center; gap: 8px; padding: 7px; border: 0; border-radius: 7px;
      background: var(--surface); color: var(--text); text-align: left;
    }
    .account-button:hover { background: var(--surface-2); }
    .account-button > span:nth-child(2) { min-width: 0; }
    .account-button .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 650; }
    .account-button .name { display: block; }
    .account-button .role {
      display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--faint); font-size: 10.5px;
    }
    .account-button small { color: var(--faint); font-size: 10.5px; }
    .workspace-item, .session-item {
      width: 100%; text-align: left; border: 0; border-radius: 7px; background: transparent;
      padding: 8px 9px; color: var(--muted); margin-bottom: 3px;
    }
    .workspace-item strong, .session-item strong {
      display: block; color: inherit; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .workspace-item span, .session-item span {
      display: block; margin-top: 2px; color: var(--faint); font-size: 10.5px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .workspace-item:hover, .session-item:hover { color: var(--text); background: var(--surface-2); }
    .session-item.active { color: var(--text); background: var(--surface-3); box-shadow: inset 2px 0 0 var(--accent); }
    .meeting-nav { display: grid; gap: 4px; margin-bottom: 14px; }
    .meeting-item {
      width: 100%; text-align: left; border: 0; border-radius: 7px; background: transparent;
      padding: 8px 9px; color: var(--muted);
    }
    .meeting-item strong {
      display: block; color: inherit; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .meeting-item span {
      display: block; margin-top: 2px; color: var(--faint); font-size: 10.5px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .meeting-item:hover { color: var(--text); background: var(--surface-2); }
    .meeting-item.active { color: var(--text); background: var(--surface-3); box-shadow: inset 2px 0 0 var(--accent); }
    .workspace-main { min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
    .session-bar {
      flex: none; min-height: 49px; display: flex; align-items: center; gap: 16px;
      padding: 8px 18px; border-bottom: 1px solid var(--line); background: rgba(23,25,29,.88);
    }
    .breadcrumb { min-width: 0; flex: 1; display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12.5px; }
    .breadcrumb strong {
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--text); font-size: 14px; font-weight: 650;
    }
    .breadcrumb .separator { color: var(--faint); }
    .breadcrumb-workspace {
      max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      border: 0; background: transparent; color: var(--muted); padding: 0; font-size: 12.5px;
    }
    .breadcrumb-workspace:hover { color: var(--text); }
    .breadcrumb[hidden],
    .session-tabs[hidden] { display: none; }
    .session-bar[hidden] { display: none; }
    .header-actions { flex: none; display: flex; align-items: center; gap: 8px; }
    .toolbar-btn {
      width: 30px; height: 30px; flex: none; display: grid; place-items: center;
      border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--muted);
    }
    .toolbar-btn:hover { color: var(--text); background: var(--surface-2); }
    .toolbar-btn svg { width: 15px; height: 15px; }
    .session-item { width: calc(100% - 19px); margin-left: 19px; }
    .session-tabs {
      display: flex; align-items: center; gap: 2px; flex: none; padding: 3px;
      border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
    }
    .tab {
      min-width: 60px; padding: 5px 10px; border: 0; border-radius: 4px;
      background: transparent; color: var(--muted); font-size: 12px; white-space: nowrap;
    }
    .tab:hover { color: var(--text); background: var(--surface-2); }
    .tab.active { color: #fff; background: var(--accent); }
    .demo-note {
      flex: none; color: var(--amber); background: var(--amber-soft);
      border-radius: 999px; padding: 3px 8px; font-size: 10px; white-space: nowrap;
    }
    .stage { flex: 1; min-height: 0; overflow: auto; padding: 18px 20px 28px; }
    .view[hidden] { display: none; }
    .task-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 38%); gap: 20px; align-items: start; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .head-actions { flex: none; display: flex; align-items: center; gap: 8px; }
    .page-head .compact { min-width: 140px; }
    .page-head h1 { margin: 0; font-size: 18px; line-height: 1.3; }
    .page-sub { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .primary {
      flex: none; display: inline-flex; align-items: center; justify-content: center; min-height: 32px;
      padding: 6px 12px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font-size: 12px;
    }
    .primary:hover { filter: brightness(1.08); }
    .ghost {
      display: inline-flex; align-items: center; justify-content: center; min-height: 28px;
      padding: 4px 9px; background: transparent; border: 1px solid var(--line-strong);
      border-radius: 6px; color: var(--text); font-size: 12px;
    }
    .ghost:hover { background: var(--surface-2); }
    .ghost:disabled { cursor: not-allowed; color: var(--faint); border-color: var(--line); }
    .ghost.small { min-height: 24px; padding: 2px 7px; font-size: 11px; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
    .metric { padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .metric b { display: block; font-size: 18px; line-height: 1.2; }
    .metric span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .toolbar { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .scope-tabs {
      display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface);
    }
    .scope { border: 0; background: transparent; border-radius: 5px; padding: 5px 10px; color: var(--muted); font-size: 12px; }
    .scope.active { color: var(--text); background: var(--surface-3); }
    .search { flex: 1 1 180px; min-width: 150px; }
    input, select, textarea {
      width: 100%; min-width: 0; padding: 7px 9px; color: var(--text);
      border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface);
    }
    textarea { resize: vertical; }
    select { appearance: none; }
    .compact { width: auto; }
    .task-list { margin-top: 12px; display: grid; gap: 8px; }
    .task {
      width: 100%; text-align: left; border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--surface); padding: 12px; transition: border-color .15s, background .15s;
    }
    .task:hover { border-color: rgba(79,142,247,.4); background: var(--surface-2); }
    .task.selected { border-color: var(--accent); background: #1a2536; }
    .task-top { display: flex; gap: 8px; align-items: flex-start; }
    .id { flex: none; color: var(--faint); font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .title { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 13px; font-weight: 600; }
    .meta { margin-top: 7px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .pill {
      display: inline-flex; align-items: center; gap: 4px; border-radius: 4px; padding: 2px 6px;
      color: var(--muted); background: var(--surface-3); font-size: 10.5px; white-space: nowrap;
    }
    .pill.todo { color: var(--muted); }
    .pill.claim { color: var(--amber); background: var(--amber-soft); }
    .pill.progress { color: var(--accent); background: var(--accent-soft); }
    .pill.review { color: var(--purple); background: var(--purple-soft); }
    .pill.done { color: var(--green); background: var(--green-soft); }
    .pill.high { color: var(--red); background: var(--red-soft); }
    .pill.agent { color: var(--purple); background: var(--purple-soft); }
    .workspace { color: var(--muted); font-size: 11px; }
    .assignee { margin-left: auto; display: flex; align-items: center; gap: 6px; min-width: 0; }
    .avatar {
      flex: none; width: 20px; height: 20px; border-radius: 50%; display: inline-flex;
      align-items: center; justify-content: center; color: #fff; font-size: 9px; font-weight: 700;
    }
    .avatar.human { background: #2f9e66; }
    .avatar.agent { background: #6f53d6; }
    .avatar.role { background: #37618f; border-radius: 5px; }
    .assignee-name { color: var(--muted); font-size: 11px; max-width: 118px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .due { color: var(--faint); font-size: 11px; white-space: nowrap; }
    .due.soon { color: var(--amber); }
    .empty { padding: 36px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); text-align: center; font-size: 13px; }

    .detail { min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); background: #14161a; }
    .detail-inner { padding: 16px; }
    .detail-head { display: flex; align-items: flex-start; gap: 12px; }
    .detail-head h2 { margin: 0; font-size: 16px; line-height: 1.35; overflow-wrap: anywhere; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .field { display: grid; gap: 4px; min-width: 0; }
    .label { color: var(--faint); font-size: 11px; }
    .value { overflow-wrap: anywhere; }
    .section { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
    .section h3 { margin: 0 0 8px; font-size: 13px; }
    .description { color: #ccd3da; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .checklist { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
    .checklist li { display: flex; gap: 7px; align-items: flex-start; color: var(--muted); font-size: 12px; }
    .check { flex: none; width: 12px; height: 12px; margin-top: 3px; border: 1px solid var(--line-strong); border-radius: 3px; }
    .check.done { border-color: var(--green); background: var(--green-soft); }
    .timeline { display: grid; gap: 10px; }
    .event { display: grid; grid-template-columns: 82px minmax(0,1fr); gap: 8px; color: var(--muted); font-size: 12px; }
    .event time { color: var(--faint); font-size: 11px; white-space: nowrap; }
    .event b { color: var(--text); font-weight: 600; }
    .actions { display: flex; flex-wrap: wrap; gap: 7px; }
    .card { padding: 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
    .card .label { color: var(--muted); }
    .link-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .link-row strong { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .workflow-list, .workbench-list, .chat, .meeting-participants { display: grid; gap: 10px; }
    .workflow-item { padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .workflow-top { display: flex; align-items: flex-start; gap: 10px; }
    .workflow-top h3 { margin: 0; flex: 1; min-width: 0; font-size: 14px; overflow-wrap: anywhere; }
    .workflow-steps { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .step { padding: 3px 7px; border-radius: 4px; background: var(--surface-3); color: var(--muted); font-size: 10.5px; }
    .step.active { color: var(--accent); background: var(--accent-soft); }
    .step.done { color: var(--green); background: var(--green-soft); }
    .workflow-bottom { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; }
    .workflow-bottom small { color: var(--faint); }
    .employee-module { padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .employee-head { display: flex; align-items: center; gap: 10px; }
    .employee-head h3 { margin: 0; flex: 1; min-width: 0; font-size: 14px; }
    .employee-role { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .avatar-line {
      display: flex; align-items: center; gap: 8px; min-width: 0; margin-top: 10px;
      padding: 8px; border-radius: 6px; background: var(--surface-2);
    }
    .avatar-line .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .avatar-line small { display: block; color: var(--faint); font-size: 10px; }
    .status { flex: none; padding: 2px 6px; border-radius: 4px; font-size: 10px; }
    .status.active { color: var(--green); background: var(--green-soft); }
    .status.expired { color: var(--red); background: var(--red-soft); }
    .chat {
      max-width: 820px; padding-top: 4px;
    }
    .message { display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 9px; }
    .message-name { font-size: 12px; font-weight: 700; }
    .message-name small { margin-left: 6px; color: var(--faint); font-weight: 400; }
    .bubble { margin-top: 4px; padding: 10px 11px; border-radius: 8px; background: var(--surface); color: #d7dde4; font-size: 13px; }
    .mention { color: var(--accent); background: var(--accent-soft); border-radius: 3px; padding: 0 3px; }
    .chat-input { display: flex; gap: 8px; margin-top: 16px; max-width: 820px; }
    .trajectory { display: grid; gap: 10px; max-width: 860px; }
    .meeting-card { padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .meeting-name { font-size: 13px; font-weight: 700; }
    .meeting-meta { color: var(--faint); font-size: 10.5px; margin: 4px 0 10px; }
    .participant { display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 8px; align-items: center; }
    .participant-name { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .participant-owner { color: var(--faint); font-size: 10px; }
    .participant.expired .participant-name { color: var(--faint); }
    .meeting-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
    .meeting-actions .ghost { justify-content: center; }

    .mask {
      position: fixed; inset: 0; display: none; z-index: 20;
      background: rgba(8,10,13,.58); padding: 28px 16px; overflow: auto;
    }
    .mask.open { display: grid; place-items: center; }
    .modal { width: min(720px, 100%); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; border-bottom: 1px solid var(--line); }
    .modal-head h2 { margin: 0; font-size: 15px; }
    .modal form { display: grid; gap: 12px; padding: 16px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .form-grid .wide { grid-column: 1 / -1; }
    .footer { display: flex; justify-content: flex-end; gap: 8px; }
    .icon-btn { width: 28px; height: 28px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); }
    .icon-btn:hover { color: var(--text); background: var(--surface-2); }
    .toast {
      position: fixed; left: 50%; bottom: 24px; z-index: 40; transform: translateX(-50%) translateY(16px);
      background: var(--surface-3); border: 1px solid var(--line-strong); color: var(--text);
      border-radius: 6px; padding: 8px 12px; font-size: 12px; opacity: 0; pointer-events: none; transition: .18s;
    }
    .toast.show { transform: translateX(-50%); opacity: 1; }
    @media (max-width: 900px) {
      .shell { display: block; }
      .rail.left, .rail.right { position: fixed; top: 0; bottom: 0; z-index: 24; box-shadow: 0 0 40px rgba(0,0,0,.36); }
      .rail.left { left: 0; transform: translateX(-100%); transition: transform .24s ease; }
      .rail.right { right: 0; transform: translateX(100%); transition: transform .24s ease; }
      .shell.left-closed .rail.left, .shell.meeting-open .rail.right { transform: translateX(0); }
      .workspace-menu { position: fixed; top: 62px; left: 10px; right: auto; width: min(300px, calc(100vw - 20px)); }
      .task-layout { grid-template-columns: 1fr; }
      .session-bar { align-items: flex-start; flex-wrap: wrap; gap: 8px; padding: 10px 14px; }
      .breadcrumb { flex: 0 0 calc(100% - 86px); }
      .breadcrumb strong { font-size: 13px; }
      .session-tabs { max-width: 100%; overflow-x: auto; }
      .detail-head { flex-wrap: wrap; }
  }
  @media (max-width: 1080px) {
      .metrics { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .form-grid, .grid { grid-template-columns: 1fr; }
    }
  </style>

        <div class="detail-head">
          <div>
            <div class="label">${task.id} · ${task.type}</div>
            <h2>${task.title}</h2>
          </div>
          <span class="pill ${task.status}">${statusLabel[task.status]}</span>
        </div>
        <div class="grid section" style="border-top:0;padding-top:12px">
          <div class="field"><span class="label">接收方</span><span class="value">${name}</span></div>
          <div class="field"><span class="label">类型</span><span class="value">${task.receiverType === "agent" ? "DE / 分身" : task.receiverType === "role" ? "角色" : "人员"}</span></div>
          <div class="field"><span class="label">创建人</span><span class="value">${task.createdBy}</span></div>
          <div class="field"><span class="label">优先级 / 到期</span><span class="value">${task.priority} · ${task.due ?? "不限"}</span></div>
        </div>
        <div class="section">
          <h3>描述</h3>
          <div class="description">${task.description}</div>
        </div>
        <div class="section">
          <h3>验收标准</h3>
          <ul class="checklist">
            ${task.acceptance.map((item, index) => `
              <li><span class="check ${task.status === "done" || (task.status === "review" && index === 0) ? "done" : ""}"></span>${item}</li>
            `).join("")}
          </ul>
        </div>
        <div class="section">
          <h3>关联事项</h3>
          ${task.links.length ? task.links.map((link) => `
            <div class="card link-row">
              <div><span class="label">${link.type}</span><div><strong>${link.label}</strong></div></div>
              <button class="ghost small" type="button">${link.type === "会议" ? "打开会议" : "打开工作流"}</button>
            </div>
          `).join("") : '<div class="description">未关联会议或工作流。</div>'}
        </div>
        <div class="section">
          <h3>操作</h3>
          <div class="actions">${actions.join("") || "当前状态下没有可用操作。"}</div>
        </div>
        <div class="section">
          <h3>动态</h3>
          <div class="timeline">
            ${task.events.map((event) => `<div class="event"><time>${event.time}</time><span>${event.text}</span></div>`).join("")}
          </div>
        </div>
      `;
    }

    function render() {
      renderUi();
      renderMetrics();
      renderTasks();
      renderDetail();
    }

    function toast(message) {
      const node = $("#toast");
      node.textContent = message;
      node.classList.add("show");
      window.clearTimeout(node._timer);
      node._timer = window.setTimeout(() => node.classList.remove("show"), 1800);
    }

    function openCreate() {
      renderReceiverOptions($("#receiverType").value);
      $("#createMask").classList.add("open");
    }
    function closeCreate() {
      $("#createMask").classList.remove("open");
      $("#createForm").reset();
    }
    function renderReceiverOptions(type) {
      $("#receiverSelect").innerHTML = directory[type].map((item) =>
        `<option value="${item.id}">${item.name}</option>`
      ).join("");
    }

    function createSession(workspace) {
      const id = `sess-${Date.now()}`;
      sessions.unshift({ id, workspace: workspace || state.workspace || "一切皆插件", name: "新 Session", kind: "会议 Session", last: "刚刚创建" });
      conversations[id] = [];
      trajectories[id] = [{ time: "现在", text: "Olivia 创建了 Session。" }];
      ui.currentSessionId = id;
      ui.globalView = null;
      ui.sessionView = "conversation";
      render();
      toast("已新增 Session");
    }

    $("#globalTabs").addEventListener("click", (event) => {
      const drawerButton = event.target.closest("[data-drawer]");
      if (drawerButton) {
        ui.meetingOpen = !ui.meetingOpen;
        render();
        return;
      }
      const button = event.target.closest("[data-global]");
      if (!button) return;
      ui.globalView = button.dataset.global;
      ui.sessionView = null;
      render();
    });
    $("#settingsShortcut").addEventListener("click", () => {
      ui.globalView = "settings";
      ui.sessionView = null;
      render();
    });
    $("#sessionTabs").addEventListener("click", (event) => {
      const button = event.target.closest("[data-session]");
      if (!button) return;
      ui.sessionView = button.dataset.session;
      ui.globalView = null;
      render();
    });
    $("#sidebarToggle").addEventListener("click", () => {
      ui.leftOpen = !ui.leftOpen;
      render();
    });
    $("#closeMeeting").addEventListener("click", () => {
      ui.meetingOpen = false;
      render();
    });
    $("#workspaceGroups").addEventListener("click", (event) => {
      const addButton = event.target.closest("[data-add-session]");
      if (addButton) {
        createSession(addButton.dataset.addSession);
        return;
      }
      const sessionButton = event.target.closest("[data-session-id]");
      if (sessionButton) {
        ui.currentSessionId = sessionButton.dataset.sessionId;
        ui.globalView = null;
        ui.sessionView = "conversation";
        render();
        return;
      }
      const button = event.target.closest("[data-workspace-selection]");
      if (!button) return;
      state.workspace = button.dataset.workspaceSelection;
      state.taskProject = button.dataset.workspaceSelection;
      state.workflowProject = button.dataset.workspaceSelection;
      const visible = sessions.filter((item) => !state.workspace || item.workspace === state.workspace);
      if (!visible.some((item) => item.id === ui.currentSessionId)) ui.currentSessionId = visible[0]?.id;
      ui.globalView = "task";
      ui.sessionView = null;
      render();
    });
    $("#workspaceAddToggle").addEventListener("click", () => {
      const form = $("#workspaceAddForm");
      form.hidden = !form.hidden;
      if (!form.hidden) form.querySelector("input").focus();
    });
    $("#workspaceAddForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const name = new FormData(event.currentTarget).get("workspaceName").trim();
      if (name && !workspaces.includes(name)) workspaces.push(name);
      state.workspace = name;
      state.taskProject = name;
      state.workflowProject = name;
      ui.globalView = "task";
      ui.sessionView = null;
      event.currentTarget.reset();
      event.currentTarget.hidden = true;
      render();
      toast(`已新增项目 ${name}`);
    });
    $("#meetingNav").addEventListener("click", (event) => {
      const button = event.target.closest("[data-meeting-id]");
      if (!button) return;
      ui.currentMeetingId = button.dataset.meetingId;
      renderMeeting();
    });
    document.addEventListener("click", (event) => {
      const button = event.target.closest("[data-demo]");
      if (button) toast(`Demo：${button.dataset.demo}`);
    });

    $("#scopeTabs").addEventListener("click", (event) => {
      const button = event.target.closest(".scope");
      if (!button) return;
      document.querySelectorAll(".scope").forEach((item) => item.classList.remove("active"));
      button.classList.add("active");
      state.scope = button.dataset.scope;
      renderTasks();
    });
    $("#search").addEventListener("input", (event) => { state.search = event.target.value.trim(); renderTasks(); });
    $("#statusFilter").addEventListener("change", (event) => { state.status = event.target.value; renderTasks(); });
    $("#assigneeFilter").addEventListener("change", (event) => { state.receiver = event.target.value; renderTasks(); });
    $("#taskProjectFilter").addEventListener("change", (event) => {
      state.taskProject = event.target.value;
      renderTasks();
      renderTop();
    });
    $("#workflowProjectFilter").addEventListener("change", (event) => {
      state.workflowProject = event.target.value;
      renderWorkflow();
      renderTop();
    });
    $("#taskList").addEventListener("click", (event) => {
      const task = event.target.closest(".task");
      if (!task) return;
      selectedId = task.dataset.id;
      renderTasks();
      renderDetail();
    });
    $("#taskDetail").addEventListener("click", (event) => {
      const button = event.target.closest("[data-action]");
      if (!button) return;
      const task = tasks.find((item) => item.id === selectedId);
      const action = button.dataset.action;
      const now = "09/22 10:24";
      if (action === "claim") {
        task.receiverType = "human";
        task.receiver = "olivia";
        task.status = "progress";
        task.events.push({ time: now, text: "<b>Olivia</b> 认领了角色任务" });
        toast("已认领任务");
      }
      if (action === "start") {
        task.status = "progress";
        task.events.push({ time: now, text: "状态变更为 <b>进行中</b>" });
        toast("任务已开始");
      }
      if (action === "submit") {
        task.status = "review";
        task.events.push({ time: now, text: "<b>Olivia</b> 提交验收" });
        toast("已提交验收");
      }
      if (action === "approve") {
        task.status = "done";
        task.events.push({ time: now, text: "<b>Olivia</b> 验收通过" });
        toast("任务已完成");
      }
      if (action === "reject") {
        task.status = "progress";
        task.events.push({ time: now, text: "<b>Olivia</b> 退回并补充意见" });
        toast("已退回");
      }
      if (action === "nudge") {
        task.events.push({ time: now, text: "<b>Olivia</b> 发送了催办提醒" });
        toast("已提醒接收方");
      }
      if (action === "close") {
        task.status = "done";
        task.events.push({ time: now, text: "<b>Olivia</b> 关闭了任务" });
        toast("任务已关闭");
      }
      render();
    });
    $("#receiverType").addEventListener("change", (event) => renderReceiverOptions(event.target.value));
    $("#createButton").addEventListener("click", openCreate);
    $("#cancelCreate").addEventListener("click", closeCreate);
    $("#closeCreate").addEventListener("click", closeCreate);
    $("#createMask").addEventListener("click", (event) => { if (event.target === event.currentTarget) closeCreate(); });
    $("#createForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      const id = `TSK-${1043 + tasks.filter((task) => task.id.startsWith("TSK-")).length}`;
      const workspace = String(form.get("workspace"));
      const acceptance = String(form.get("acceptance") ?? "").split("\n").map((item) => item.trim()).filter(Boolean);
      tasks.unshift({
        id, title: String(form.get("title")), type: form.get("type"), status: form.get("receiverType") === "role" ? "claim" : "todo",
        priority: form.get("priority"), workspace: form.get("workspace"), receiverType: form.get("receiverType"),
        receiver: form.get("receiver"), createdBy: me, createdAt: "2026-09-22 10:24", due: form.get("due") || "",
        description: String(form.get("description")), acceptance: acceptance.length ? acceptance : ["按描述完成并自查"],
        links: [], events: [{ time: "09/22 10:24", text: `<b>Olivia</b> 创建并派发` }],
      });
      selectedId = id;
      state.workspace = workspace;
      state.taskProject = workspace;
      state.scope = "sent";
      document.querySelectorAll(".scope").forEach((item) => item.classList.toggle("active", item.dataset.scope === "sent"));
      ui.globalView = "task";
      ui.sessionView = null;
      closeCreate();
      render();
      toast("任务已派发");
    });

    render();
  </script>
</body>
</html>
